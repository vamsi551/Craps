<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Craps Roll Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .rolls { margin-top: 20px; }
    .roll-entry { display: inline-block; padding: 5px 10px; margin: 3px; border: 1px solid #ccc; border-radius: 5px; }
    .seven { background-color: #ffcccc; }
    .on { background-color: #ccffcc; }
    .off { background-color: #eeeeee; }
    button { margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Craps Roll Tracker with ON/OFF Strategy</h2>

  <label>Enter Roll (2–12): <input type="number" id="rollInput" min="2" max="12"></label>
  <br>
  <label><input type="radio" name="status" value="on" checked> ON</label>
  <label><input type="radio" name="status" value="off"> OFF</label>
  <br>
  <button onclick="addRoll()">Add Roll</button>
  <button onclick="resetRolls()">Reset</button>

  <div class="rolls" id="rollsContainer"></div>

  <script>
    const rollsContainer = document.getElementById('rollsContainer');

    function addRoll() {
      const roll = parseInt(document.getElementById('rollInput').value);
      const status = document.querySelector('input[name="status"]:checked').value;

      if (!roll || roll < 2 || roll > 12) {
        alert("Please enter a valid roll (2–12).");
        return;
      }

      const div = document.createElement('div');
      div.classList.add('roll-entry');
      if (roll === 7) div.classList.add('seven');
      if (status === 'on') div.classList.add('on');
      else div.classList.add('off');

      div.textContent = `Roll: ${roll} (${status.toUpperCase()})`;
      rollsContainer.appendChild(div);

      document.getElementById('rollInput').value = '';
    }

    function resetRolls() {
      rollsContainer.innerHTML = '';
    }
  </script>
  <p><a href="index.html">← Back to Index</a></p>
</body>
</html>
